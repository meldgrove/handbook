name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"

jobs:
  checks:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npm run db:generate -- --name ci-check
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            git status --porcelain apps/server/drizzle
            echo "The schema in apps/server/src/db/schema has changes without a migration. Run: npm run db:generate"
            exit 1
          fi
      - run: npm run build
      # What the image installs (Dockerfile, prod-deps).
      - run: npm audit --omit=dev --omit=optional --audit-level=high

  integration:
    name: Integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: handbook
          POSTGRES_PASSWORD: handbook
          POSTGRES_DB: handbook
        ports: ["55450:5432"]
        options: >-
          --health-cmd "pg_isready -U handbook -d handbook"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  e2e:
    name: End-to-end with Keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: PostgreSQL and Keycloak
        run: docker compose -f compose.dev.yaml up -d
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8104/realms/handbook/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker compose -f compose.dev.yaml logs keycloak
          exit 1
      - run: npm run test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t handbook:ci .
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id handbook:ci -u)" = "1000"
      - name: The image starts its processes
        run: |
          docker run --rm --entrypoint node handbook:ci --import /app/apps/server/dist/instrument.mjs -e "process.exit(0)"
